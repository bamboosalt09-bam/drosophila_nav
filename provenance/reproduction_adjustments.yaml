    Calling src/core/westeinde2024.py a reproduction of the Westeinde et al.
    2024 reduced steering model (abstract connectivity, ELU1).  It does NOT
    license any claim about the connectome-scale 'data' variant, which is not
    implemented, nor about whole-brain simulation.

