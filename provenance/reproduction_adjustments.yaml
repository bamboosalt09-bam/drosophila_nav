# =========================================================================
# STAGE 0 PART 2 -- ideal closed loop (2026-09-15)
# =========================================================================
stage0_part2_ideal_loop:
  verdict: PASSED
  script: experiments/stage0_ideal_loop.py
  results: results/stage0_loop/default/
  configuration: >
    50 runs x 6 PFL scalars x 1000 steps at 10 Hz, starting anti-goal at
    180 deg, source noise (gaussian -> butterworth 2 Hz -> zscore -> x10),
    k = 200, ideal body, passthrough plugin, ideal heading sensor.

  source_trend_reproduced:
    statistic: "rho = |mean(exp(i*heading))|, the source's heading consistency"
    rho_by_S: {0.0: 0.377, 0.2: 0.603, 0.4: 0.888, 0.6: 0.951, 0.8: 0.971, 1.0: 0.973}
    note: >
      Monotone increase with the PFL scalar, reproducing the source's Figure 5
      claim that PFL drive controls how tightly the goal is held.  S = 0 gives
      exactly zero steering, so its rho is a no-control random-walk baseline,
      not goal holding.

  scheduler_equivalence:
    claim: >
      Condition A run through our general scheduler
      (decoder -> passthrough plugin -> ideal body -> ideal sensor) IS the
      source's own closed loop.
    max_rho_difference: 0.041
    deterministic_max_deviation_deg: 1.32   # over 18 calibration/test starts
    residual_cause: >
      The source loop snaps the heading to its precomputed 1 deg grid on every
      step; ours evaluates the core at the exact heading.

findings_stage0_part2:

  F1_second_attractor:
    severity: high -- affects how Stage 1 failures may be classified
    observation: >
      With the source's own gain k = 200 (peak 2000 deg/s at T_core = 0.1 s)
      the IDEAL closed loop has two attractors: the goal, and a period-2 limit
      cycle alternating near +99.6 / -100.4 deg.
    basin: >
      73.8% of initial heading errors converge to the goal; the rest fall into
      the limit cycle.  The two basins INTERLEAVE -- 178 deg converges while
      179 deg does not -- so there is no single "basin edge" angle.
    mechanism: >
      The per-step heading increment is k*steering, which reaches 200 deg.
      Near the goal the map contracts (1 + k*ds/de = 0.245), but in the
      mid-range it overshoots, and the overshoot is what sustains the cycle.
    consequence: >
      Oscillation observed later with a CONSTRAINED body must not be
      attributed to the body without checking this baseline first
      (handoff doc section 27).  The ideal body already oscillates from some
      initial conditions.
    not_a_bug: >
      k = 200 is the source's value, applied to the source's normalised
      steering.  We are not free to retune it -- doing so would break the
      "frozen decoder" rule (doc section 46).  It is recorded as a property of
      the reproduced model.

  F2_anti_goal_equilibrium_is_unstable:
    observation: >
      Steering at exactly 180 deg is ~8e-15, not 0.  Started there, the loop
      amplifies that rounding residual by a factor of 4.67 per cycle (the
      instability multiplier 1 + k*ds/de at 180 deg) and escapes after about
      19 steps.
    reproducibility_warning: >
      The escape is SEEDED BY FLOATING-POINT ROUNDING, so its direction is not
      portable across platforms, numpy builds or BLAS versions.  Any 180 deg
      stress test must use an explicit symmetry-breaking perturbation and
      report it (handoff doc section 48).  Pinned by
      tests/test_closed_loop.py::test_anti_goal_equilibrium_is_unstable_and_amplifies_rounding
    separatrix_effect: >
      Near 180 deg the source's 1 deg heading quantisation can select a
      different attractor than our continuous loop: at 179 deg the source
      reaches the goal and ours reaches the limit cycle.  Trajectory-level
      agreement is therefore not expected at the separatrix; rho statistics
      agree throughout.

# =========================================================================
# STAGE 1 -- constrained body (2026-09-15)
# =========================================================================
stage1_body_parameter_scale:
  doc_section: 17
  doc_recipe: "R99 = 99th percentile of |r_brain| in the ideal baseline"
  status: REPLACED -- estimator changed, intent kept
  evidence:
    r99_converging_trials_by_duration_deg_per_s:
      2s: 1367.0
      5s: 898.4
      10s: 270.7
      30s: 5.1
      100s: 0.0
    r99_all_trials_by_duration_deg_per_s:
      2s: 1998.6
      100s: 2000.0
  why_it_fails: >
    The command time-series is not a distribution with a meaningful upper
    percentile.  It is a short transient plus a long tail of ~zero: the ideal
    loop reaches the goal in 3-4 cycles, so 71.5% of samples are below
    1 deg/s and the percentile measures recording length, not command size.
    Over all trials the statistic is instead dominated by the trials that fall
    into the period-2 limit cycle (finding F1) and saturates at the decoder
    peak.
  replacement:
    definition: "R_max = kappa * max|steering| = 2000 deg/s"
    why_well_defined: >
      The core's steering is normalised so that |steering| <= 1 on the
      calibration grid, so R_max is exact, duration-independent and
      trial-independent: the fastest turn the brain can ever request.
    numerical_agreement: "R99(all trials) = 1999.7 vs R_max = 2000.0 (0.02%)"
    consequence: "the sweep grid of section 17 is unchanged in practice"
  frozen_in: configs/neural_command_scale.json
  warning: >
    R_max is a simulation scale, never a vehicle specification.  Read
    "r_max = 0.5 R_max" as "the body can execute half of the fastest turn the
    brain ever requests".

stage1_components_added:
  files:
    - src/body/yaw_plant.py      # rate limit, acceleration cap, first-order lag
    - src/plugins/rate_clip.py   # plugin B, goal-blind
    - tests/test_body_limits.py  # doc section 44 items 7, 8, 9
  notes:
    tau_r_vs_alpha_max: >
      Kept as separate mechanisms and pinned by a test (doc section 11): a
      small command is shaped by the lag and never touches the cap, a large
      one saturates the cap.  They are not double counting.
    integration_guard: >
      Explicit Euler on the first-order lag is unstable unless
      dt_body << tau_r; the plant refuses to construct when
      tau_r < 2*dt_body rather than producing silent garbage.

# =========================================================================
# RETRACTION -- Stage 1 noise control (2026-09-15)
# experiments/stage1_noise_control.py, results/stage1_noise_control/
# =========================================================================
retracted_findings:

  rescued_by_body:
    claimed: >
      "Body limits rescue the core: 72.2% of the trials where the ideal body
      failed were completed successfully by the constrained body."
    status: RETRACTED -- artifact of the noise-free protocol
    evidence: >
      With the source's own command noise switched on, the ideal body succeeds
      at 100% of initial headings including +-90 deg, over 8 seeds.  Stage 0
      finding F1 (the period-2 limit cycle) exists only in the deterministic,
      noise-free condition; noise perturbs the trajectory out of the cycle and
      into the goal basin.  There is therefore nothing for the body to rescue,
      and the RESCUED_BY_BODY class only ever fires under a protocol that
      manufactures the failure it then rescues.
    what_remains_true: >
      F1 itself is real and still matters as a deterministic property of the
      core+decoder at k = 200 -- but it must be reported as "noise-free only",
      never as a failure mode of the circuit in general.
    lesson: >
      Section 24's "noise off, to isolate the body effect" is not free.  It
      removes a term the source model relies on.  Any Stage 1 result that
      depends on a baseline FAILURE has to be re-checked with noise on.

  r_max_main_effect:
    claimed: >
      "A faster body is worse: success falls from 0.979 to 0.646 as
      r_max goes from 0.01 to 1.0 R_max."
    status: RETRACTED as a main effect -- it is an interaction
    evidence: >
      At tau_r = T the success rate is 1.00 at every r_max tested (spread
      0.00).  The apparent main effect came from marginalising over tau_r,
      which mixes in the high-lag cells where the two interact.
    corrected_statement: >
      Rate capability alone does not hurt.  A fast body is harmful only in
      combination with response lag: at tau_r = 8T, success goes
      1.00 / 1.00 / 0.92 / 0.49 for r_max = 0.01 / 0.05 / 0.25 / 1.0 R_max.
      The boundary lives in the (r_max, tau_r) plane, not on either axis.
    lesson: >
      Same class of error as the selection effect caught in
      stage1_sweep_analysis.py: a marginal average over a grid with a strong
      interaction is not a main effect.

surviving_findings:
  tau_r_degradation:
    status: HOLDS with noise on
    statement: >
      Response lag degrades heading recovery monotonically, and does so
      without any feasibility limit being reached -- a genuine control
      failure rather than a physical one.
  three_axes_differ:
    status: HOLDS
    statement: >
      The rate limit only ever causes failure by making the task physically
      infeasible (success rate tracks feasibility exactly).  The acceleration
      cap and the response lag cause failures while the task remains feasible.
      That difference is the section 30 result.

# =========================================================================
# Conditions C and D (2026-09-16)
# =========================================================================
condition_C_state_aware_plugin:
  doc_section: 14.2
  status: NOT IMPLEMENTED -- measured to be a no-op where it matters
  proposed_law: "r_cmd = clip(r_brain, r - alpha_max*tau_r, r + alpha_max*tau_r) n [-r_max, r_max]"
  when_it_binds: "only when alpha_ratio * tau_ratio < r_max_ratio"
  measurement:
    failure_cells_alpha_4: "max trajectory deviation from B is exactly 0.00 deg"
    where_it_binds: "success 0.78 -> 0.67 at (r_max 1.0, alpha 0.005-0.01, tau 1)"
  conclusion: >
    In every cell where condition B actually fails, alpha_max*tau_r vastly
    exceeds r_max, so the clamp reduces to B's rate clip and the two are
    bit-identical.  Where it does bind it is neutral to harmful.  The document
    anticipated this in 14.2 and section 31 records that a null result for C
    is itself a result, so the plugin file was not written.
  if_revisited: >
    A plugin that could matter here would have to compensate the RESPONSE LAG,
    not the feasibility envelope -- and must stay goal-blind while doing it.

condition_D_p_controller:
  doc_section: 15
  implementation: src/core/p_controller.py
  law: "steering = clip(-K * wrap(heading - goal), -1, 1)"
  K: 0.35
  calibration: >
    Chosen on the 8 calibration initial headings with an ideal body, lowest
    IAE among K that succeed on all of them; frozen for the sweep exactly like
    kappa (sections 15, 47).  K >= 1.0 saturates and fails on all 8 -- the same
    over-gain failure the fly core shows at k = 200.
  paired_result:
    fly_core_success: 0.857
    p_controller_success: 0.793
    cells_where_both_fail: 59
    cells_where_only_fly_fails: 3
    cells_where_only_p_fails: 10
  reading: >
    The task-feasibility question section 15 exists to answer comes back clean:
    where the fly core fails, a generic controller under the same freeze
    almost always fails too (59 cells), so those failures are body-attributable
    rather than circuit-specific.  Only 3 cells are fly-specific, all at
    r_max = 1.0 R_max with tau_r = 8T -- the fast-body-plus-lag corner, which
    is the same interaction found in the sweep.
  caveat: >
    K is frozen, not re-tuned per body condition.  That is the protocol
    (section 3.3 applies to the baseline too), so the comparison is fair by
    construction, but "the fly core beats a P controller" means "beats a P
    controller under the same freeze", not "beats a tuned P controller".

# =========================================================================
# Condition C redesigned -- lag compensation (2026-09-16)
# =========================================================================
condition_C_lag_compensation:
  implementation: src/plugins/lag_comp.py
  motivation: >
    Section 14.2 said C would have to be redesigned, and the measurement
    agreed: the proposed feasibility clamp is bit-identical to B wherever B
    fails.  The surviving failures are caused by RESPONSE LAG, so this
    compensates that instead.
  law: "u = (r_brain - r*exp(-T/tau)) / (1 - exp(-T/tau)), clipped to r_max"
  why_no_tuning_knob: >
    Exact one-cycle inversion of the plant's first-order lag.  Nothing is
    fitted, so there is no parameter that could smuggle in task knowledge.
  goal_blind_verified:
    by_signature: "command(r_brain, r_actual); tau_r and r_max are body capability (section 3.5)"
    by_ablation: >
      With the core output forced to zero the heading moves by exactly
      0.000e+00 deg at tau = T and tau = 32T (section 44 item 12), pinned by
      tests/test_body_limits.py::test_lag_comp_is_goal_blind_and_cannot_navigate
  paired_result_vs_B:
    mean_success: "0.859 -> 0.942"
    cells: "42 better, 4 worse, 134 equal"
    effect_is_entirely_on_tau:
      tau_1_to_4: "+-0.008 (nothing)"
      tau_8: "+0.046"
      tau_16: "+0.154"
      tau_32: "+0.308"
    tau_axis_after_C: "0.942 -> 0.933 across tau = 1..32T, i.e. no effect"
  remaining_boundary:
    statement: >
      With C installed the lag axis is gone and the only failure mode left is
      the acceleration cap interacting with the rate limit.
    evidence: |
      alpha >= 0.02:  r_max 0.98 / 1.00 / 1.00 / 1.00 / 1.00   (flat)
      alpha <  0.02:  r_max 0.98 / 1.00 / 1.00 / 0.62 / 0.58
    caution: >
      Checked explicitly, because the same marginalisation error was made
      twice before: C's apparent r_max main effect is again an INTERACTION,
      this time with alpha_max.  Do not report it as a main effect.
  where_C_hurts:
    cells: "4, all at alpha_max = 0.01 R_max/T, delta -0.125"
    reason: >
      Same mechanism as its benefit: the inversion commands a large yaw rate,
      and a body whose acceleration cap cannot deliver it ends up worse off
      than under the plain rate clip.  C helps when lag is the binding
      constraint and hurts when acceleration is.
  it_does_not_repeal_physics: >
    Where the acceleration cap genuinely binds (alpha = 0.005, accel
    saturation fraction 0.77) C reaches only 0.44 against B's 0.22 -- a
    partial gain, not a fix.

section_29_phase_map:
  status: done
  figure: "results/stage1_sweep/<tag>/fig6_outcome_phase_map.png"
  content: >
    Dominant OUTCOME per (r_max, tau_r) cell rather than a success rate, which
    is what section 29 actually asks for: the map says what happened, not just
    how often it worked.  Generated for every sweep tag.

noise_on_sweep:
  status: DONE -- full grid re-run with the source noise, both plugins
  motivation: >
    Every Stage 1 number before this ran noise-free (doc section 24).  The
    noise control had already shown that the ideal body's +-90 deg limit
    cycle (finding F1) does not survive noise, and F1 is what every
    BASELINE_FAILURE / RESCUED_BY_BODY trial is built on.  Only 12 cells had
    been checked, and the sweep script had no noise path at all: "noise" was
    a hardcoded provenance string, not a switch.
  implementation:
    - "src/sim/noise.py: command_noise_rad_per_s(n_steps, T, seed) -- seeded
       by an int alone, so the same draw is reused in every cell and the
       sweep is PAIRED across cells."
    - "experiments/stage1_body_sweep.py: --noise-seeds N."
    - "Condition A baseline re-run per (e0, seed).  Judging a noisy
       constrained trial against a noise-free baseline verdict would make
       RESCUED_BY_BODY a comparison of two different draws."
    - "is_task_feasible hoisted out of the seed loop: it is a property of the
       plant, not of the draw."
  regression_check: >
    --quick with noise off reproduces the previous run bit-identically
    (pandas DataFrame.equals -> True, 216 trials).
  runs:
    - "tag 'noise'          : plugin rate_clip, 36288 trials, 2460 s"
    - "tag 'noise_lagcomp'  : plugin lag_comp,  36288 trials, 2514 s"
    - "8 seeds x 18 headings x 252 cells"

  R1_rescue_result_is_a_noise_free_artifact:
    status: CONFIRMED at full scale -- the retraction stands
    measured: "condition A succeeds 144/144 baseline trials with noise on"
    consequence: >
      n_baseline_failures = 0 and n_rescued_by_body = 0 in both noise runs,
      against 504 and 364 noise-free.  Every trial in those two categories
      was an e0 = +-90 deg trial, i.e. F1.  The "body limits rescue the core"
      claim exists ONLY in the deterministic protocol and must never be
      reported without that qualifier.
    side_effect: "attributable fraction rises 0.725 -> 0.817"

  R2_body_attributable_failure_survives_noise:
    status: CONFIRMED
    measured: >
      Genuine failure modes persist with noise on: saturation_dominated 4.1%,
      slow_but_stable 4.0%, overshoot_dominant 2.5%, persistent_oscillation
      1.7%.  Paired axis directions are unchanged in sign from the noise-free
      sweep (r_max hurts, alpha helps, tau hurts).
    note: >
      This is the half of the Stage 1 result that is real.  Noise makes the
      constrained-body failures modestly WORSE, not better.

  R3_body_lag_low_passes_neural_noise:
    status: NEW FINDING -- visible only with noise on
    observation: >
      At r_max = 0.05 R_max, alpha = 0.005, success is NON-MONOTONIC in tau:
      0.66 (tau=T), 0.65, 0.75, 0.94, 1.00 (tau=16T), 0.75 (tau=32T).
      Noise-free the same cells are all 1.000 except tau=32 (0.875), so the
      effect is invisible without noise.
    consistency: "all 8 seeds show it independently (tau=16 -> 1.000 in every seed)"
    mechanism_measured: >
      std(r_commanded) is flat at ~1.5 rad/s across tau (same injected
      noise), while std(r_actual)/std(r_commanded) falls monotonically
      0.510 -> 0.276 as tau goes T -> 32T.  The plant is low-passing the
      command noise; success tracks that attenuation until the lag's own
      phase cost takes over, giving an optimum near tau = 16 T.
    interpretation: >
      A body constraint can IMPROVE navigation by filtering neural noise.
      This is an embodiment result in the opposite direction from the
      retracted rescue claim, and unlike that one it requires noise rather
      than being destroyed by it.
    related: "the rate clip does the same job at the other end of the grid --
      plugin_intervention_fraction 0.996 at r_max=0.002 falling to 0.022 at
      r_max=1.0, while accel_saturation_fraction rises 0.000 -> 0.336.  The
      constraint does not disappear as r_max grows, it moves from the rate
      limit to the acceleration limit."

  R4_prediction_that_failed:
    status: PREDICTION MADE BEFORE THE RUN, THEN FALSIFIED -- recorded as such
    prediction: >
      If body lag helps by low-passing noise (R3), then plugin C, which
      inverts one cycle of that lag, should REMOVE the filter and lose
      performance in exactly those cells.
    measured: >
      It does not.  At r_max=0.05, alpha=0.005 the deltas C-B are
      +0.01 +0.07 +0.00 +0.06 +0.00 +0.22 across tau = 1..32; C is equal or
      better everywhere in that slice and +0.22 at tau=32.
    why_the_prediction_was_wrong: >
      C amplifies the command by 1/(1-a) and the plant attenuates it by the
      same factor, so the noise reaches the body at roughly its unfiltered
      level while the intended signal is restored in phase.  C trades the
      filter for the removal of the phase lag, and under these conditions
      that trade is favourable.
    kept_because: >
      Section 31: a falsified prediction that was stated in advance is worth
      more than one quietly dropped.

  R5_condition_C_under_noise:
    paired_B_vs_C: "0.825 -> 0.912 (55 cells better, 20 worse, 105 equal)"
    tau_axis_after_C: "0.907 0.910 0.912 0.920 0.923 0.898 -- flat, as noise-free"
    by_tau_delta: "tau=1 -0.006, tau=8 +0.059, tau=16 +0.164, tau=32 +0.303"
    the_20_worse_cells: >
      All at alpha <= 0.05 and mostly tau <= 8, max harm -0.062.  Same
      mechanism as noise-free: the inversion commands more acceleration than
      the cap can deliver.  Not a new failure mode.
    conclusion: >
      Condition C's result is unchanged by noise in both direction and shape.

  caveats:
    feasibility_is_still_noise_free: >
      is_task_feasible uses noiseless max-effort reachability, so a trial that
      is only marginally feasible may be counted as a genuine failure when
      noise pushed it over.  The check is deliberately generous to the body,
      so this inflates apparent body-attributable failure rather than hiding
      it.  Not corrected; recorded.
    marginal_axis_numbers: >
      provenance.json's axis_effect_range_MARGINAL / largest_marginal_effect_axis
      are unpaired marginals and are NOT main effects.  Renamed from
      axis_effect_range / largest_effect_axis for exactly that reason; the two
      noise runs' files were relabelled in place after the fact (same numbers).
    runtime: >
      ~41 min per full noise sweep, 1.54x the estimate extrapolated from a
      1728-trial run.  Per-trial cost is uniform across the grid (40.9-42.8 ms
      measured at three corners), so the overshoot is most likely GC pressure
      from the 36288-row results list, which a 21x smaller benchmark does not
      show.  Progress prints now flush; a redirected run was block-buffered
      and therefore indistinguishable from a hung one for 40 minutes.

  R6_no_axis_has_a_main_effect:
    status: NEW -- this is why the marginal numbers keep misleading
    stored_in: "results/stage1_sweep/<tag>/interaction_split.csv (192 rows,
      one conditional success rate per axis x level x held-axis x held-level)"
    produced_by: "experiments/stage1_sweep_analysis.py, on the paired subset"
    method: >
      For every ordered axis pair, hold one axis at each of its levels and
      take the spread (max - min) of the other axis within that level.  A
      genuine main effect keeps roughly the same spread at every level of the
      other axes; an interaction does not.
    condition_B_with_noise:
      r_max_within_tau:    "0.19 0.19 0.22 0.44 0.68 0.76   (marginal 0.41)"
      r_max_within_alpha:  "0.69 0.50 0.32 0.29 0.34 0.34   (marginal 0.41)"
      tau_within_alpha:    "0.15 0.24 0.38 0.40 0.40 0.40   (marginal 0.32)"
      tau_within_r_max:    "0.11 0.06 0.25 0.60 0.63        (marginal 0.32)"
      alpha_within_r_max:  "0.00 0.00 0.17 0.48 0.40        (marginal 0.21)"
      alpha_within_tau:    "0.33 0.33 0.32 0.20 0.06 0.02   (marginal 0.21)"
      finding: >
        Not one axis holds its spread.  The acceleration cap is the clearest
        case: alpha changes NOTHING at r_max <= 0.02 (spread 0.00) and is the
        dominant axis at r_max = 0.25 (spread 0.48); symmetrically it does
        nothing once tau >= 16 (0.06, 0.02).  There is no main effect anywhere
        in this experiment, so no marginal mean in it is a valid summary.
    condition_C_restructures_the_grid:
      r_max_within_tau:    "0.20 0.20 0.20 0.21 0.20 0.18   (flat)"
      tau_within_alpha:    "0.06 0.05 0.04 0.04 0.04 0.04   (collapsed)"
      tau_within_r_max:    "0.11 0.02 0.06 0.06 0.01        (collapsed)"
      alpha_within_r_max:  "0.00 0.00 0.14 0.70 0.70        (steep)"
      r_max_within_alpha:  "0.70 0.40 0.10 0.02 0.02 0.02   (steep)"
      finding: >
        C does not merely raise the mean.  It removes the r_max x tau
        interaction outright (r_max's spread becomes flat at ~0.20 across
        every tau) and collapses tau's own influence everywhere, leaving a
        single clean boundary in alpha x r_max.  That is a stronger and more
        checkable statement of what C achieved than the paired mean
        0.825 -> 0.912, and it is the form the Stage 1 conclusion should take.
    consequence_for_reporting: >
      Any sentence of the form "a faster body is worse" or "more lag is
      worse" is inadmissible on its own; it must name the level of the other
      two axes.  fig4's caption used to assert exactly those main effects and
      has been rewritten to point at this file instead.

connectivity_data_audit:
  status: AUDITED -- the option does not run as published; do not call it
    "the connectome" without the qualifications below
  audited_by: "reference/check_connectivity_data.py (executes the authors'
    own cells 0/3/5/7, no reimplementation)"
  why: >
    The next step is to compare idealised against measured connectivity in the
    SAME steering circuit.  The option is named 'data', which invites the
    assumption that it is a per-cell connectome model.  Checked instead of
    assumed, at the user's instruction.

  two_bugs_stop_it_running:
    B1_hd_prefs_is_a_python_list: >
      Cell 5 sets hd_prefs = [165, ..., -165] as a LIST in the data branch
      (it is a numpy array in the abstract branch).  Cell 7 then computes
      -1*hd_prefs, which for a list is repetition by -1, i.e. the empty list.
      The goal input silently becomes shape (361, 0) and the cell raises.
      Repair: np.asarray(...).  No free parameter.
    B2_hardcoded_1000_in_the_dna02_step: >
      Cell 7 tiles the DNa03->DNa02 term by a literal (1000, 1, 1, 1) while
      the data branch sets num_cells = 12, so the two operands cannot
      broadcast.  Repair: tile by num_cells.  Verified to carry no free
      parameter -- broadcasting admits only 1 or num_cells, and those two
      give bit-identical results, because tiling then summing over the cell
      axis is the same operation either way.

  Q1_per_neuron_or_summed:
    answer: "both, at different stages"
    detail: >
      PFL2/PFL3 -> DN weights are per-cell vectors of length 12, indexed by
      protocerebral bridge glomerulus, so the PFL side IS per-neuron.  The
      DNa03 -> DNa02 weight is a single scalar (271): the descending neurons
      are single units, not populations.  The left hemisphere's weights are
      np.flip of the right, i.e. left-right symmetry is ASSUMED, not measured.
      12 cells per population is the hemibrain count for these types, not a
      whole-connectome model.

  Q2_synapse_count_to_weight:
    answer: "no conversion at all -- raw synapse counts are the weights"
    measured: "pfl2->dna03 mean 61.7 (range 1-96), pfl3->dna03 16.7,
      pfl3->dna02 20.8, dna03->dna02 271"
    note: >
      The abstract weights are these ratios rounded: 61.7/16.7 = 3.70 -> 4,
      271/20.8 = 13.01 -> 12.  So 'abstract' is not an arbitrary idealisation;
      it is the data condition with per-cell heterogeneity averaged away.
      That makes the comparison a test of HETEROGENEITY, not of whether the
      connectome numbers were used at all.

  Q3_what_normalisation_changes:
    answer: >
      ELU1 rescales by the batch min/max at every stage and the final steering
      is divided by its own global max, so any uniform gain is removed.  What
      survives the normalisation is the SHAPE of the response and the relative
      weighting between cells -- which is exactly what differs here, so the
      comparison is not a normalisation artifact.

  Q4_same_input_body_evaluation:
    answer: "NO -- the PFL head-direction preferences differ as well"
    detail: >
      Abstract assigns uniformly spaced preferences plus a fixed phase shift
      (180 / +67.5 / -67.5 deg).  Data uses per-cell preferences predicted
      from PB glomerulus, with no added shift.  The goal population is
      identical at 12 cells (both give 165 ... -165 in 30 deg steps).
      Cell count is NOT a confound: abstract at 12 cells reproduces abstract
      at 1000 cells (steering at e = -90 deg: 0.959 vs 0.960).
    weights_and_prefs_are_not_separable: >
      Pairing the data weights with abstract HD preferences produces a
      BROKEN controller -- steering at e = -45 deg flips sign (-0.061), i.e.
      positive feedback near the goal.  The per-cell weights are only
      meaningful in their glomerulus ordering, so "weights" and "preferences"
      cannot be ablated independently.  Reported as a coupling, not as an
      effect decomposition.

  headline_consequence_for_the_next_experiment:
    finding: >
      The abstract condition is EXACTLY goal-phase invariant (restoring gain
      CV 0.000, max/min 1.00 across all 37 goal phases), because 1000
      uniformly spaced identical cells are rotationally symmetric.  The data
      condition is NOT: its restoring gain varies 11.7x with goal direction
      (CV 0.638), weakest at goal = +120 deg, strongest at goal = +10 deg.
    consequence: >
      Every Stage 1 run holds goal = 0.  For the abstract core that is
      harmless, because of the invariance just measured.  For the data core it
      would sample one arbitrary point of an 11.7x range, so the data-condition
      sweep MUST vary the goal direction as well as the initial heading error.
      Any comparison that does not is measuring the choice of goal, not the
      connectivity.
    also: >
      The data core's restoring gain at goal = 0 is 33% lower than abstract's
      (0.00253 vs 0.00380 per degree) and its response is flatter.  Since the
      decoder gain kappa multiplies this, the two conditions do not produce
      the same command scale, which raises the open design question below.

  open_design_question_before_running:
    question: "shared R_max, or one per condition?"
    detail: >
      R_max = kappa * max|steering| sets the physical meaning of every body
      axis.  If each condition calibrates its own R_max, the two are not
      driving the same bodies and the weaker data command is normalised away
      -- hiding the very difference being tested.  If both share the abstract
      condition's R_max, "body" means the same thing in both and the gain
      difference shows up as behaviour.
    recommendation: "share R_max, taken from the abstract condition"
    status: NOT YET DECIDED -- to be settled with the user before any sweep

data_connectivity_condition:
  status: IMPLEMENTED and VERIFIED -- but the planned comparison cannot be run
    as designed; see D1
  core: "src/core/westeinde2024_data.py (WesteindeDataCore), satisfies the
    same SteeringCore protocol as the abstract core"
  agreement_with_source: >
    Our core reproduces the repaired source arrays to 1.665e-15 max absolute
    difference over 925 (goal, HD) points at S = 1.  For comparison the
    abstract core agrees to 3.4e-14.
  norm_constants: configs/norm_constants_data.json (steering_max 0.5188658127)
  shared_R_max:
    decision: "user, 2026-09-16: share R_max from the abstract condition"
    how_it_holds: >
      Each core divides by its OWN steering_max, exactly as the source does,
      so both commands span [-1, 1] and R_max = kappa*max|steering| is the
      same 2000 deg/s.  The bodies are therefore literally identical between
      conditions.  What the normalisation removes is the arbitrary magnitude
      of the raw weights (0.3151 abstract vs 0.5189 data); what survives is
      the response SHAPE and the goal dependence, which is what is being
      compared.

  D1_data_connectivity_does_not_steer_to_the_commanded_goal:
    status: NEW FINDING -- and it blocks the planned sweep
    measured_in_the_sources_own_arrays: >
      Stable zero of the open-loop steering function, minus the commanded
      goal, at S = 1.  Abstract: 0.0 deg at every goal.  Data: 0.0 at goal 0,
      +7.2 at 30, +31.6 at 60, +36.4 at 150, and NO stable zero at all near
      goal = +-90 or +-120 deg.  The bias is odd-symmetric (-7.2 at -30,
      -31.6 at -60).
    confirmed_in_closed_loop: >
      With an ideal body and no noise the data core settles to the same
      offset headings (37.2 at goal 30, 91.6 at goal 60, -173.6 at goal 150),
      independent of initial error, i.e. a genuine fixed-point offset rather
      than a transient.  At goal = 120 the settled heading also depends on
      the initial condition (56-82 deg of bias), so the attractor structure
      there is more complex.
    not_an_artifact_of_our_code: >
      Read directly out of the authors' arrays with no closed loop and none of
      our core.  Pinned by
      tests/test_core_symmetry.py::test_data_connectivity_does_not_steer_to_the_commanded_goal
    mechanism: >
      A PFL cell's goal input is assigned by CELL INDEX.  In the abstract
      condition the PFL and goal populations share one hd_prefs array, so
      every cell has the SAME mismatch between its own HD preference and its
      goal cell's -- that mismatch IS the fixed phase shift (67.5 / 180 deg).
      In the data condition the goal population is uniformly spaced at 30 deg
      while the PFL3 preferences come from PB glomeruli spanning L7..R2, so
      the per-cell mismatch is irregular: PFL3R gives
      [-75,-90,-105,-75,-90,-105,-75,-90,-105,-75,-45,-60] instead of a
      constant.  That irregularity breaks the rotational symmetry that makes
      the abstract core's fixed point exact.  PFL2's mismatch IS regular
      ([-165,-180,165] repeating), and PFL3L is an exact mirror of PFL3R, so
      goal = 0 remains exact.
    interpretation_limits: >
      Whether the irregular tiling is biology (PFL3R really does innervate
      mostly left PB glomeruli) or an indexing choice cannot be settled from
      the published code.  The bias is therefore NOT yet evidence that the
      real connectome fails to steer -- it is evidence that this reduced
      model, wired this way and with the goal input assigned by index, does.
      The left = mirror-of-right assumption is also the source's, not a
      measurement, and the bias being odd-symmetric is exactly what that
      assumption would produce.

  consequence_for_the_planned_comparison:
    problem: >
      The question was how differently the idealised and measured wirings
      fail under BODY constraints.  With a perfect body and no noise the data
      core already fails the task at every initial error for goals 60-150 deg,
      so half of goal space is a baseline failure before any body limit is
      applied.  A sweep over the full goal range would spend half its trials
      in BASELINE_FAILURE and measure nothing about the body.
    options_not_yet_chosen:
      A: "restrict the sweep to the goal range where the data core does hold
          heading (|goal| <= ~45 deg) and run the body comparison there"
      B: "additionally test a corrected variant that pairs each PFL cell's
          goal input with its OWN HD preference -- this would be OUR
          modelling intervention, not the source's, and must be labelled so"
      C: "report D1 as the result and drop the body comparison for this core"
    recommendation: "A, with B as a clearly-labelled second condition"

  sweep_support_added:
    - "experiments/stage1_body_sweep.py --controller data"
    - "experiments/stage1_body_sweep.py --goal-step N (0 = the Stage 1
       behaviour, goal fixed at 0). Required for any data-core sweep, since
       that core's restoring gain varies 12x with goal direction."
    - "baseline condition A is now keyed by (goal, e0, seed)"
    - "regression: --quick with goal-step 0 and noise off reproduces the
       earlier run bit-identically (DataFrame.equals)"

flywire_whole_brain_step:
  status: DATA ACQUIRED -- retinotopy gate only PARTLY passed; decision pending
  decision_context: >
    User redirected the study back to its original question (section 1): put
    the whole circuit in, give it real sensory input, read the motor output,
    without designating which circuit computes navigation.  Input and output
    are designated ANATOMICALLY (sensory / descending super_class), not
    functionally, which is what keeps that non-circular.

  data_sources:
    connections:
      file: data/flywire/proofread_connections_783.feather (852 MB)
      from: "Zenodo 10.5281/zenodo.10676866, CC-BY-4.0, NO login required"
      note: "Codex itself needs a Google sign-in; the Zenodo deposit does not,
        so no API token was needed."
    annotations:
      file: data/flywire/neuron_annotations_783.tsv (31.7 MB)
      from: "github.com/flyconnectome/flywire_annotations, public"
      paper: "Schlegel et al., Nature 634, 139-152 (2024)"
    aggregated: "data/flywire/edges_783.npz (built by summing the published
      per-neuropil rows into neuron pairs)"

  measured_graph:
    raw_rows: 16847997          # split per neuropil
    neuron_pair_edges: 15091983
    edges_by_synapse_threshold:
      ">=1": 15091983
      ">=2": 7595967
      ">=3": 4916231
      ">=5": 2700513
      ">=10": 1066822
    synapses_per_edge: "median 2, mean 3.6, max 2405"
    note: >
      The threshold is simultaneously a modelling choice and the runtime
      control (>=5 is 5.6x fewer edges than >=1).  It must be justified, not
      picked for speed.
    sign_assumption: >
      ACh/DA/OA/5-HT excitatory, GABA/Glu inhibitory, taken from the
      per-edge synapse-weighted transmitter prediction: 58.9% excitatory,
      41.1% inhibitory.  This is an ASSUMPTION, not connectome data.

  anatomical_designation:
    sensory: "super_class sensory 16907 + sensory_ascending 612"
    motor_output: "super_class descending 1303 (right 649 / left 646 / centre 8)"
    other: "optic 77541, visual_projection 8038, central 32383, motor 110"
    why_it_matters: >
      The steering readout is the left-right difference over descending
      neurons, which is anatomy ("axons leaving the brain for the nerve cord")
      rather than a navigation hypothesis.  Nothing in between is designated.

  R1_photoreceptors_are_not_in_the_volume:
    measured: "R7 1342 and R8 1324 are present; R1-R6 are absent (0 matches)"
    cause: "R1-R6 somata sit in the retina, outside the imaged brain volume"
    consequence: >
      Visual input cannot be injected at R1-R6.  Their direct targets, the
      lamina monopolar cells L1-L5, ARE present (1378-1699 each), so the
      injection point moves one synapse inward.  Still anatomically defined,
      and a far smaller concession than injecting a heading into visual
      projection neurons.

  R2_retinotopy_gate_partly_passed:
    status: OPEN -- this is what gates "give the fly its own view"
    problem: >
      To turn a rendered scene into per-neuron input we need each medulla
      column's viewing direction.  The annotation has 3D positions but no
      visual direction and no column index (Mi1 is labelled 'columnar' with
      no identifier).
    route_1_coordinates:
      result: "sheet yes, lattice no"
      measured: >
        Mi1 counts 788 left / 796 right, matching the ~750-800 ommatidia per
        eye.  Positions lie on a sheet (99.8% of variance in 2 axes) but are
        not a clean lattice: nearest-neighbour spacing CV 0.60-0.75 and only
        1.7-1.8 neighbours within 1.5x the median spacing, where a hexagonal
        lattice needs ~6.  Soma coordinates are slightly better (2.2) but
        still not a lattice.
    route_2_connectivity:
      result: "locality present, lattice still not clean"
      measured: >
        Shared-partner overlap between Mi1 cells decays with rank --
        29 / 25 / 20 / 13 / 8 shared partners at the 1st / 3rd / 6th / 12th /
        30th best match -- so retinotopic locality IS carried by the
        connectome.  But the step at 6 neighbours is weak (6th/12th ratio
        1.54-1.57) and a spectral embedding still gives 1.8 neighbours, not 6.
    route_3_azimuth_only:
      result: "WORKABLE, and probably sufficient"
      reasoning: >
        The standard heading cue is a vertical bar, which is constant in
        elevation, so the task needs each column's AZIMUTH -- a 1D map --
        not a full 2D lattice.
      measured: >
        The sheet's first principal axis carries 71-75% of the variance,
        spans 58.0 um (left) and 60.5 um (right) -- near-perfect mirror
        symmetry -- and covers that axis evenly (columns per bin over 20 bins
        vary with CV 0.13-0.21).
      caveat: >
        That this axis IS azimuth is an anatomical expectation, not something
        validated here: the medulla's anterior-posterior axis is expected to
        carry azimuth.  The resulting map is OURS, not the connectome's, and
        must be labelled that way.  Interommatidial angles are non-uniform
        over a curved eye, so a linear map along this axis is an
        approximation of unquantified error.

  compute_feasibility_on_this_machine:
    hardware: "Intel Core Ultra 5 125H, 14C/18T, 15.5 GB RAM, Intel Arc iGPU
      (no CUDA)"
    memory: "NOT the constraint -- the graph is ~30 MB at 3.7M edges"
    measured_single_thread: >
      Event-driven LIF at FlyWire scale: 2.0 s wall per 1 s biological at
      dt = 1 ms, 34.6 s at dt = 0.1 ms.  dt is not a free speed knob -- the
      spike rate changes with it (2231 vs 869 spikes/step), so it changes the
      dynamics too.
    measured_parallel: >
      Trials are independent, and 14 workers give 5.6x (not 14x) -- memory
      bandwidth bound.  333 full 15 s trials per hour, i.e. 1000 trials in
      ~3 h and Stage 1's 36288 in ~4.5 days.
    consequence: >
      Steps 1-3 (does a bump form, does it track heading, does a steering
      signal appear) are single runs and fit comfortably.  Only a
      body-constraint sweep needs more, and that would need a batched GPU
      implementation -- a rewrite, not a port.
    caveat: >
      The timing probe used RANDOM topology.  The real connectome is
      heavy-tailed with hub neurons, so locality of memory access is worse
      and the real figure is likely slower.

retinotopy_resolved:
  status: RESOLVED -- the published column assignment exists and is public
  supersedes: "flywire_whole_brain_step.R2_retinotopy_gate_partly_passed, where
    this was recorded as an open gate with only an azimuth approximation"

  how_it_was_found: >
    User asked to look for prior work rather than build it.  Matsliah et al.
    2024 ("Neuronal parts list and wiring diagram for a visual system",
    Nature) had already done exactly the assignment attempted here by probe:
    all Mi1 cells were semi-automatically assigned to hexagonal lattice
    points, and the other columnar cells were matched to Mi1 one-to-one with
    the Hungarian algorithm on the connectivity matrix.

  public_source:
    url: "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/column_assignment.csv.gz"
    found_via: "hsseung/OpticLobe.jl src/codexdependencies.jl, which registers
      the Codex files as DataDeps -- the bucket is public even though the
      Codex web app requires a Google sign-in"
    other_files_in_the_same_bucket:
      - visual_neuron_types.csv.gz
      - classification.csv.gz
      - neurons.csv.gz
      - cell_stats.csv.gz
      - consolidated_cell_types.csv.gz
      - connections_princeton_no_threshold.csv.gz  # 263 MB
      - connections_buhmann_no_threshold.csv.gz    # 202 MB

  what_it_contains:
    rows: 45528
    columns: "root_id, hemisphere, type, column_id, x, y, p, q"
    coordinate_system: >
      (p, q) hexagonal lattice, the eye coordinate system defined in Figure 2
      of Arthur Zhao et al. 2022.
    coverage: >
      BOTH hemispheres: left 785 columns / 22595 neurons, right 796 columns /
      22933 neurons.  31 columnar cell types.
    joins_cleanly: >
      45518 / 45528 root_ids match our annotation table (100.0%), and the
      file's `hemisphere` agrees with the annotation's `side` for every row.
    injection_targets_have_coordinates: >
      L1 1572, L2 1557, L3 1412, L4 1332, L5 1556 neurons -- the direct
      targets of the missing R1-R6 -- all carry (p, q), as do R7 (1253) and
      R8 (1276).

  what_this_replaces: >
    The azimuth-only approximation derived from Mi1 positions (first principal
    axis, 71-75% of variance) is no longer needed.  It was OUR construct with
    unquantified error; this is the published assignment, and it gives a full
    2D lattice rather than one axis.

  what_is_still_ours:
    mapping_pq_to_viewing_direction: >
      (p, q) is a lattice INDEX, not a direction.  Turning it into azimuth and
      elevation still needs a convention, and that convention is ours.  It is
      now a clean parametric map over a regular lattice rather than a fit to a
      messy point cloud, but the error it carries is still unquantified --
      interommatidial angles are not uniform over a curved eye.
    eye_model_parameters: >
      Taken from TuragaLab/flyvis (Lappalainen et al. 2024,
      flyvis/datasets/rendering/eye.py): ommatidial acceptance angle 5.8 deg,
      hexagonal sampling of a rendered image.  Their model tiles a SYNTHETIC
      lattice of 721 columns (extent 15) built from FIB25/FIB19 rather than
      recovering one from FlyWire, so the eye geometry transfers but the
      lattice does not -- we use the measured FlyWire assignment instead.

  prior_art_notes:
    shiu_et_al_2024:
      repo: github.com/philshiu/Drosophila_brain_model
      simulator: "Brian 2, Python"
      inputs: "Completeness_783.csv + Connectivity_783.parquet"
      how_sensory_input_is_applied: >
        Neurons are activated at a fixed frequency by FlyWire ID, to model
        optogenetic activation.  OPEN LOOP -- stimulate and record spikes.
        There is no body, no sensor and no feedback, so the closed loop is the
        part this project adds rather than reuses.
    lappalainen_et_al_2024:
      repo: github.com/TuragaLab/flyvis
      approach: >
        Connectome-constrained deep mechanistic network in PyTorch, 64 cell
        types over 721 synthetic columns (~45k neurons), optic lobe only, with
        single-neuron and single-synapse parameters LEARNED by optimisation
        against a motion task.
      relevance: >
        Shows the standard answer to "how do you feed a rendered scene to a
        columnar visual system": impose a regular hex lattice and build the
        eye model on it, rather than recovering retinotopy from coordinates.
        Also a warning -- their parameters are fitted, so their success does
        not imply an unfitted connectome model will work.

flywire_whole_brain_first_results:
  status: RUNS END TO END -- but does not yet compute navigation
  what_is_designated: >
    Input at super_class sensory / the columnar cells carrying the fly's own
    view; output read as the left-right difference over super_class
    descending.  Both anatomical.  Nothing between them is chosen.

  parameters:
    source: "Shiu et al. 2024 model.py, checked rather than assumed"
    values: "rest/reset -52 mV, threshold -45 mV, membrane 20 ms, synaptic
      5 ms, refractory 2.2 ms, delay 1.8 ms, w = sign * synapses * 0.275 mV,
      no synapse threshold"
    sign_rule: >
      ACh/DA/OA/5-HT excitatory, GABA/Glu inhibitory -- confirmed to be the
      same rule Shiu et al. use.  Applied per PRESYNAPTIC NEURON, not per
      edge: the connection table's per-edge transmitter averages disagree with
      the neuron's own call on 20.5% of edges and flip the sign on 9.6%.
    w_scale: >
      The one free parameter, and it was mis-set.  At 1.0 the central brain
      sits at 0.2 Hz, i.e. silent; at 2.0 it sits at 33 Hz, which is
      physiological, and EPG starts firing.  2.0 is now the working point.
    drive: >
      0.20 mV/step for a lit column.  Measured: 0.06 clears threshold but not
      the optic lobe (0 descending active), 0.20 gives 124, 0.50 gives 213 but
      pins the input at its 455 Hz refractory ceiling.

  R1_visual_drive_reaches_the_output: >
    Descending neurons are 2-3 synapses from the injected columnar cells (450
    reached at hop 2, 1293 at hop 3).  The early failure to propagate was
    drive strength, not wiring.

  R2_heading_dependence_is_real_but_not_a_steering_signal:
    measured: >
      The descending left-right difference depends on bar position and the
      dependence is reproducible across durations (every heading keeps its
      sign at 300 and 500 ms).  Correlation with sin(heading) is -0.80 at the
      corrected weight scale and per-neuron signs.
    why_it_is_not_a_steering_signal: >
      A bar straight ahead should require no turn but does not give zero, the
      curve is not odd-symmetric, and the correlation is carried largely by a
      standing offset (below).

  R3_the_standing_offset_is_dynamic_not_an_input_artifact:
    measured: >
      With no input at all the difference is exactly 0.0 Hz, so there is no
      intrinsic bias.  With a uniform grey surround and NO bar it is -820 Hz,
      the same value the bar-out-of-view headings give.  With a deliberately
      left-right symmetric frontal drive it is still -700 Hz.
    wiring_is_nearly_symmetric: >
      Summed incoming weight to descending neurons is +80,718 mV on the right
      against +82,947 on the left, a 2.7% difference -- too small to explain a
      700-820 Hz output asymmetry.
    conclusion: >
      The asymmetry is produced by the network's dynamics under almost any
      drive, not by the stimulus or by our eye model.  Unexplained.

  R4_EPG_does_not_form_a_bump:
    status: RETRACTION of an earlier claim in this session
    what_was_claimed: >
      That EPG's peak unit took 5 distinct values across 12 bar positions,
      "moving the right way".
    what_is_true: >
      EPG emits isolated spikes, not a bump.  Peak rates are 3.3-10 Hz with
      means of 0.2-1.5 Hz and only 3-20 of 47 units active; almost every
      "peak" is exactly 3.0 Hz, which at 300 ms is a SINGLE spike.  The
      distinct-peak count was argmax over near-zero, mostly one-spike
      histograms -- noise, not a moving representation.
    why_it_matters: >
      EPG carrying a heading bump is the single clearest sign that the model
      computes heading.  It does not.

  earlier_retraction: >
    Also withdrawn: that every EPG has non-positive summed input weight and
    "can never fire".  The summed weight is indeed non-positive for all 47
    (median -192 mV), but that assumes every input fires at once, which is not
    how a ring attractor works, and EPG does fire once the weight scale is
    right.  EPG receiving mostly inhibition is biology -- ring neurons are
    GABAergic, Delta7 glutamatergic -- not a bug.

  performance_note: >
    A 20x slowdown (688 s for a sweep that takes 51 s) was traced to a
    transient allocation, not to the model: mapping transmitter names edge by
    edge built a 15M-element object Series of Python strings and pushed this
    machine into swap.  The resident model is only 170 MB.  Fixed by looking
    the sign up through a 139k float32 array; output bit-identical.

  open:
    - "the standing left-right offset under symmetric input"
    - "why EPG barely fires at a weight scale that puts the rest of the
       central brain at 33 Hz"
    - "heading -90 activates ~20,000 neurons against ~16,000 elsewhere at
       equal luminance"
    - "L1/L2 invert luminance; the probe drives them proportionally"

training_pilot:
  status: LOOP WORKS -- and the pilot found a design fault before any real run
  purpose: >
    User's framing, adopted: the question is not "is the connectome faster to
    train than a standard AI" -- too many confounds -- but what optimisation
    DOES to a connectome-wired network under identical training, against
    matched null wirings.  Trajectory, not endpoint.

  what_was_built_on_the_laptop:
    rate_model: >
      src/core/flywire_rate.py.  Rate, not spiking, because a hard threshold
      is not differentiable; dynamics follow flyvis.  PyTorch, device-agnostic,
      so the same code runs on a GPU without a rewrite.
    nulls: >
      src/core/null_wiring.py.  degree_preserving keeps each source's
      out-edges, weights and sign and resamples only the targets from the
      empirical in-degree (|w| sum and the 0.402 inhibitory fraction
      unchanged, max out-degree 8895 vs 9783, 0.59% of edges land back on a
      real partner).  random_sparse keeps only size and the weight multiset
      (max degree 158 vs 9783).
    pilot: experiments/flywire_train_pilot.py

  what_is_trainable:
    decision: "per-cell-type tau, bias and gain; wiring and synapse counts FIXED"
    why: >
      Training free per-synapse weights would leave the connectome as nothing
      but a sparsity mask, and no result could then be about the connectome.
    grouping: >
      cell_type is far too fine -- 8,840 groups, 26,520 numbers.  cell_class is
      the anatomical level above (49 values over 77% of neurons, super_class
      for the rest): 58 groups, 174 parameters, the same order as flyvis's 64
      cell types.  The self-check caught the first attempt.

  measured_cost:
    per_iteration: "60 s, dropping to 45 s with truncated backprop"
    truncated_bptt: >
      The readout is a steady-state rate, so backpropagating through the whole
      200 ms transient cost 1.8 GB and ~250 s per iteration for little
      gradient.  run(grad_ms=40) keeps only the last 40 ms: 4x faster.
    projection: >
      3 conditions x 5 seeds x 200 iterations is ~50 h on this laptop, so the
      real run needs the GPU machine.  That is now a measured requirement
      rather than a guess.

  P1_training_does_not_descend_and_the_reason_is_structural:
    observed: >
      At lr 0.05 the loss bounces (1.13, 0.95, 1.48, 1.50) and at lr 0.01 over
      12 iterations it does not move at all (1.131 -> 1.184), with the
      correlation ending where it started (+0.856 -> +0.862).  Meanwhile the
      steering span SHRINKS (4.7e-4 -> 3.5e-4) and EPG goes from 12 active
      units to 0.
    diagnosis: >
      The residual error is the standing LEFT-RIGHT asymmetry, and the
      parameters are shared per cell type ACROSS SIDES.  Measured: left and
      right descending neurons have essentially the same type composition
      (648 vs 645 in one label, 1 vs 1 in the other), so every one of the 174
      parameters applies an identical tau/bias/gain to both sides.  No setting
      of them can selectively adjust one side, so the part of the loss that
      matters is outside the reach of the parameterisation.
    fix_available: >
      FlyWireRate(by_side=True) splits the labels by side: 118 groups, 354
      parameters.  Not run yet.
    caveat: >
      A bilaterally symmetric animal makes side-specific parameters a
      concession rather than biology.  It is measurable, though: if the
      trained values come out nearly symmetric the asymmetry was in the input,
      and if they do not, training is compensating for the wiring.

  not_yet_done:
    - "run the pilot with by_side=True and see whether the loss descends"
    - "the two null conditions have never been trained, only built"
    - "multi-seed trajectories, which is what the whole design is for"

standing_asymmetry_investigation:
  status: CAUSE NARROWED, FIX NOT YET FOUND
  prompted_by: >
    User's objection: no species-wide innate turning bias is reported in
    Drosophila, so a large standing left-right output difference is more
    likely ours than the fly's.  And: what does the descending readout
    physically correspond to -- legs, wings, what?

  Q1_where_does_the_output_go:
    answer: "neither legs nor wings, and neither is in our data"
    detail: >
      Descending neurons project from the brain to the ventral nerve cord.
      The leg and wing motor circuits are IN the nerve cord, and FAFB is a
      brain-only volume, so the readout is the brain's command to the body,
      not a muscle command.
    the_readout_was_conceptually_wrong: >
      The 1,303 descending neurons span 473 distinct cell types carrying
      walking, flight, grooming and feeding commands.  DNa02 -- the pair the
      Westeinde model this project reproduced in Stage 0/1 actually reads --
      is 2 cells of those 1,303.  Summing all of them drowns it.
    but_narrowing_it_does_not_help: >
      Measured.  Normalised steering across bar positions at -120/-60/0/60/120
      deg: all descending gives 0.950 1.000 0.920 0.771 0.834, DNa02 alone
      gives 1.000 0.988 0.743 0.530 0.741.  Neither crosses zero, so both are
      a standing offset with a ripple on it.  The cause is upstream of the
      readout.
    incidental: >
      DNa01 and DNa03 are exactly silent -- reading DNa01+02+03 gives values
      bit-identical to DNa02 alone.

  Q2_the_asymmetry_is_a_reconstruction_artifact:
    measured: >
      Neuron counts are symmetric (left/right 1.013 overall, 0.995 for
      descending) but reconstructed incoming synaptic weight is not: 0.902
      overall, 0.939 into descending neurons.  So one hemisphere is ~10% more
      completely proofread, with equal cell counts.
    not_a_few_cells: >
      The five largest descending neurons carry 5.9% (left) and 5.6% (right)
      of their side's input, so the imbalance is spread across the population
      rather than concentrated -- consistent with a global reconstruction
      bias, not with biology.
    consequence: >
      A single-animal connectome carries its own measurement asymmetry into
      any laterally symmetric computation.  This is a limitation of the data,
      not of the simulation.

  F1_global_rebalancing_does_not_fix_it:
    what_was_tried: >
      load_connectome(symmetrise=True) scales each hemisphere's incoming
      weight so both sides receive the same budget.  It does what it says --
      left/right goes from 0.9023 to 1.0000.
    result: FAILED -- it moved the offset rather than removing it
    measured: >
      The steering curve flips sign and still never crosses zero: all
      descending goes from 0.950 1.000 0.920 0.771 0.834 to -0.510 -0.342
      -0.576 -1.000 -0.791.  Overcorrected.
    conclusion: >
      The asymmetry is STRUCTURED by pathway, not global, so a per-side gain
      cannot express it.  The ponytail note on that function anticipated this
      and it turned out to be the case.

  what_a_real_fix_needs:
    a_left_right_neuron_mapping: >
      Average each edge with its mirror image, which needs to know which left
      neuron corresponds to which right one.  Availability, measured:
        - 99% of neurons carry a cell_type
        - only 6,721 types are exactly balanced left/right (24,896 neurons),
          and 8,270 types are within +-1 (39,213 neurons), so most neurons sit
          in types whose two sides differ by more than one cell
        - matching_notes is populated for 374 neurons, hemibrain_type and
          supertype for 24%
      For the 45,528 columnar optic neurons we already have an exact mirror:
      the published (p, q) column assignment, so Mi1 at (p,q) left pairs with
      Mi1 at (p,q) right.  Outside the optic lobe there is no exact map and
      pairing within a cell type is arbitrary.
    not_attempted_yet: true

  prior_art_for_the_motor_interface:
    source: "NeuroMechFly 2.0 / FlyGym (Ramdya lab)"
    what_they_do: >
      Nobody wires motor neurons one by one.  The descending command is TWO
      numbers, [dL, dR], which modulate the left and right leg CPGs: the
      magnitude sets stepping amplitude and the sign sets direction.  Odour
      taxis, visual taxis and navigation all reduce to that 2D action space,
      and the CPG plus hybrid correction rules produce the joint angles and
      adhesion commands.
    consequence_for_this_project: >
      Our architecture already matches -- core -> decoder -> plugin -> body --
      but we collapse the two sides to a single R-L scalar immediately.
      Keeping [dL, dR] instead gives turning as dR-dL and forward speed as
      dL+dR, which is the standard interface and makes the body swap for
      NeuroMechFly a decoder change rather than a redesign.

asymmetry_traced_and_corrected:
  status: CAUSE FOUND AND FIXED -- the steering signal now crosses zero
  method: >
    Walked the anatomical path measuring the left/right activity ratio at each
    stage, rather than guessing at the cause.

  trace:
    per_neuron_activity_ratio_right_over_left:
      injected_columns: 1.0001
      optic: 1.0778
      visual_projection: 1.0890
      central: 1.0998
      descending: 1.1685
    incoming_weight_ratio_right_over_left:
      injected_columns: 1.3526
      optic: 1.1572
      visual_projection: 1.1335
      central: 1.0636
      descending: 1.0649
    reading: >
      Per NEURON the injected drive is exactly symmetric (1.0001), so our
      injection is fine.  The imbalance appears in the optic lobe and grows
      monotonically to 17% at the descending neurons.  Crucially the
      reconstruction asymmetry is DIFFERENT AT EVERY STAGE -- 15.7% into optic
      neurons, 6.4% into central, 6.5% into descending.

  why_the_first_two_fixes_failed:
    global_weight_rebalancing: >
      One gain for the whole brain cannot express a stage-dependent
      imbalance, so it overcorrected and merely flipped the output's sign.
    matching_the_input_columns: >
      The right eye does have more reconstructed columnar cells (5,117 against
      4,841), and eye.load(matched_only=True) equalises them exactly at 4,558
      per side.  Measured effect on the output: almost none (offset/range 2.61
      -> 2.59).  Neuron COUNT at the input was not the cause; per-neuron drive
      was already symmetric.

  the_fix_that_works:
    what: >
      balance_hemispheres(group=super_class) equalises incoming weight between
      hemispheres WITHIN each anatomical stage instead of across the brain.
    measured: >
      turn goes from never crossing zero (offset 2.59x the signal range) to
      crossing it (0.47x).  Bar on the left gives +3.5e-4 to +4.6e-4, bar at
      +90 deg gives -8.2e-5.  Correlation with sin(heading) is unchanged at
      about -0.88, so what changed is the offset, not the modulation.
    remaining_imperfection: >
      The zero crossing sits near +35 deg rather than 0, and +120 turns
      positive again.  So this is a usable steering signal, not a correct one.

  bug_fixed_at_the_root: >
    Label columns are now normalised once in load_connectome.  Both idioms in
    use were wrong in different ways: Series.to_numpy(str) truncates to <U1
    when the column holds NaN ("right" -> "r"), which silently broke every
    side lookup, and astype(str).to_numpy() leaves NaN as a float in an object
    array, which breaks np.unique.  fillna("").astype(str) once, at load.

  what_this_does_not_settle: >
    Whether the residual failure is the remaining asymmetry or the fact that
    an unfitted connectome does not compute steering.  Both are still live.

training_retry_after_symmetrisation:
  status: IN PROGRESS -- symmetrisation helped the starting point, the optimiser
    then destroyed it, and the reason has been identified
  starting_loss: >
    Removing the per-stage hemisphere imbalance more than halved the untrained
    network's loss, 1.131 -> 0.508, with the correlation unchanged at +0.856.
    So over half of what training previously had to fix was a reconstruction
    artifact rather than anything the network was doing wrong.
  what_still_fails: >
    One Adam step at lr 0.02 takes the loss from 0.508 to 1.287, after which
    it plateaus near 1.45 while the parameter distance keeps growing.
  P2_the_parameters_live_on_different_scales:
    measured: >
      Gradient norms at initialisation: bias 1.27e-1 against log_tau 9.6e-3
      and log_gain 1.07e-2, so bias is 13x the others.
    reason: >
      log_tau and log_gain are exponents -- a step of 0.02 is a 2% change.
      bias is in the same units as the activity, which sits around 0.01, so
      the same 0.02 step is TWICE the entire activity scale.  Adam normalises
      per parameter and therefore moves them at the same absolute rate, which
      is exactly the wrong thing here.
    fix: >
      Separate parameter groups, with bias at lr * 0.01 by default.  This is
      not a hyperparameter search: the ratio comes from the measured scale
      difference.
    result: WORKED -- the loss descends for the first time

  P3_the_descent_finds_a_degenerate_solution:
    measured: >
      With the scales separated the loss falls 0.508 -> 0.130 over 15
      iterations, monotonically after the third, at 65 s per iteration.  That
      is the first time training has moved at all.
    but: >
      The correlation with the target barely improves, +0.856 -> +0.873, so
      almost all of the loss reduction is scale and offset rather than SHAPE.
      And EPG collapses: peak-to-mean rises 15.7 -> 47.0 not by forming a
      bump but by silencing the population, from 13 active units of 47 down
      to 1.
    reading: >
      Training is mechanically working and finding a degenerate optimum.  A
      single surviving unit is not a heading representation, and a loss that
      falls without the shape improving is a warning, not a result.
    caveat: >
      15 iterations is very few and the loss was still falling at the last
      one, so this is not yet evidence that the optimum IS degenerate -- only
      that the trajectory is heading somewhere degenerate so far.
    not_yet_tried:
      - "longer runs, since the loss had not flattened"
      - "a loss that penalises silencing, or a shape-only objective"
      - "the two null wirings, which have still never been trained"

dataset_switch_to_malecns:
  status: DATA ACQUIRED -- switching from FAFB (brain only) to MaleCNS (brain + nerve cord)
  why_this_happened: >
    User asked repeatedly how existing fly simulations port a brain onto a
    body, pointing out that nobody wires motor neurons one by one.  Chasing
    that down showed the answer is not a clever interface: the project that
    put a whole fly in Minecraft uses a connectome that CONTAINS the motor
    neurons, drives real sensory neurons and decodes real motor neurons.

  my_error: >
    I chose FAFB, which is brain-only, when datasets covering the whole
    central nervous system were listed on the same Codex page at the very
    start of this work -- BANC v888 (158,262) and MCNS v1.0 (166,700).  When
    the user then asked whether the output went to legs or wings I answered
    "neither is in our data", which was true of my choice rather than of the
    data that existed.  Everything spent on inventing a steering readout from
    1,303 mixed descending neurons followed from that choice.

  source:
    bucket: "https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/"
    login: "NOT required -- the neuPrint web app needs an account, the bucket
      does not, the same pattern FlyWire had"
    licence: CC-BY
    files_taken:
      - "body-annotations-male-cns-v1.0-minconf-0.5.feather (14.5 MB)"
      - "body-neurotransmitters-male-cns-v1.0.feather (43.3 MB)"
      - "connectome-weights-male-cns-v1.0-minconf-0.5.feather (1.1 GB)"
    files_skipped: "syn-points (12.7 GB), syn-partners (6.8 GB), body-stats
      (780 MB) -- synapse-level detail we do not need"

  what_this_dataset_has_that_FAFB_did_not:
    motor_neurons: >
      909 of them (vnc_motor 708, cb_motor 107, vnc_efferent 94), balanced
      L 423 / R 422 / M 63.  They carry somaNeuromere (T1 182, T2 186, T3 156
      -- the three leg pairs), exitNerve (MetaLN, MesoLN, ProLN, AbN...) and
      muscle-level types: "Ti flexor MN", "Tr flexor MN", "Fe reductor MN",
      "Sternal posterior rotator MN".  The question "legs or wings" is now
      answerable from the data.
    the_nerve_cord_circuitry: >
      vnc_intrinsic 13,161 neurons.  NeuroMechFly's central pattern generator
      is hand-written; here that circuitry is DATA.  Nothing needs wiring.
    photoreceptors: >
      R1-R6 present with 3,377 neurons.  In FAFB they were absent -- somata
      sit in the retina, outside the imaged volume -- which forced injection
      one synapse inward at L1-L5.
    optic_lattice_built_in: >
      assignedOlHex1 / assignedOlHex2 on 23,720 neurons across 15 types (L1
      892 distinct hex cells, Mi1 891).  For FAFB this took finding Matsliah
      et al.'s separate column_assignment file.
    laterality_CORRECTION: >
      I claimed this dataset was laterally balanced.  That is true of somaSide
      COUNTS (L 75,215 / R 75,119 / M 392) but NOT of incoming weight, which
      measures R/L = 1.0962 -- essentially the same 10% asymmetry FAFB had.
      The dataset switch does NOT fix the laterality problem; the per-stage
      hemisphere balancing built for FAFB is still needed here.

  built:
    loader: "src/core/malecns.py, returning the same tuple as
      core.flywire_brain.load_connectome so the rate model, null wirings and
      training loop work unchanged"
    measured: >
      166,700 neurons and 6,242,118 edges at >= 5 synapses, built in 4.2 s.
      The neuron count matches the release exactly.  Two filters were needed
      and both were caught by the self-check: the connectivity table names
      1.48M bodies including unproofread fragments, so only edges with both
      ends annotated are kept; and the annotation itself has 211,577 rows of
      which only 166,700 carry a superclass -- the other 44,877 are Orphan,
      Glia, Unimportant and Out-of-scope bodies.
    edge_count_is_a_gain: >
      7.6M edges at >= 5 synapses before the annotation filter, 6.2M after,
      against FAFB's 15.1M.  The bigger dataset simulates FASTER.

  caveats:
    - "cell_class is only 12.5% populated here against FAFB's 77%, so the rate
       model's per-type parameter grouping will fall back to super_class"
    - "male, where FAFB is female, and the Westeinde model reproduced in
       Stage 0/1 is hemibrain-derived"
    - "R1-R6 exist but carry no hex coordinates, so injection may still be at
       the lamina -- now a choice rather than a forced compromise"
    - "the optic hex assignment is itself lopsided, R 13,267 / L 10,453"
    - "none of the FAFB-specific work (eye lattice, per-stage balancing,
       trained parameters) transfers unchanged"
