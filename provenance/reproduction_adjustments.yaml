# =========================================================================
# STAGE 0 PART 2 -- ideal closed loop (2026-09-15)
# =========================================================================
stage0_part2_ideal_loop:
  verdict: PASSED
  script: experiments/stage0_ideal_loop.py
  results: results/stage0_loop/default/
  configuration: >
    50 runs x 6 PFL scalars x 1000 steps at 10 Hz, starting anti-goal at
    180 deg, source noise (gaussian -> butterworth 2 Hz -> zscore -> x10),
    k = 200, ideal body, passthrough plugin, ideal heading sensor.

  source_trend_reproduced:
    statistic: "rho = |mean(exp(i*heading))|, the source's heading consistency"
    rho_by_S: {0.0: 0.377, 0.2: 0.603, 0.4: 0.888, 0.6: 0.951, 0.8: 0.971, 1.0: 0.973}
    note: >
      Monotone increase with the PFL scalar, reproducing the source's Figure 5
      claim that PFL drive controls how tightly the goal is held.  S = 0 gives
      exactly zero steering, so its rho is a no-control random-walk baseline,
      not goal holding.

  scheduler_equivalence:
    claim: >
      Condition A run through our general scheduler
      (decoder -> passthrough plugin -> ideal body -> ideal sensor) IS the
      source's own closed loop.
    max_rho_difference: 0.041
    deterministic_max_deviation_deg: 1.32   # over 18 calibration/test starts
    residual_cause: >
      The source loop snaps the heading to its precomputed 1 deg grid on every
      step; ours evaluates the core at the exact heading.

findings_stage0_part2:

  F1_second_attractor:
    severity: high -- affects how Stage 1 failures may be classified
    observation: >
      With the source's own gain k = 200 (peak 2000 deg/s at T_core = 0.1 s)
      the IDEAL closed loop has two attractors: the goal, and a period-2 limit
      cycle alternating near +99.6 / -100.4 deg.
    basin: >
      73.8% of initial heading errors converge to the goal; the rest fall into
      the limit cycle.  The two basins INTERLEAVE -- 178 deg converges while
      179 deg does not -- so there is no single "basin edge" angle.
    mechanism: >
      The per-step heading increment is k*steering, which reaches 200 deg.
      Near the goal the map contracts (1 + k*ds/de = 0.245), but in the
      mid-range it overshoots, and the overshoot is what sustains the cycle.
    consequence: >
      Oscillation observed later with a CONSTRAINED body must not be
      attributed to the body without checking this baseline first
      (handoff doc section 27).  The ideal body already oscillates from some
      initial conditions.
    not_a_bug: >
      k = 200 is the source's value, applied to the source's normalised
      steering.  We are not free to retune it -- doing so would break the
      "frozen decoder" rule (doc section 46).  It is recorded as a property of
      the reproduced model.

  F2_anti_goal_equilibrium_is_unstable:
    observation: >
      Steering at exactly 180 deg is ~8e-15, not 0.  Started there, the loop
      amplifies that rounding residual by a factor of 4.67 per cycle (the
      instability multiplier 1 + k*ds/de at 180 deg) and escapes after about
      19 steps.
    reproducibility_warning: >
      The escape is SEEDED BY FLOATING-POINT ROUNDING, so its direction is not
      portable across platforms, numpy builds or BLAS versions.  Any 180 deg
      stress test must use an explicit symmetry-breaking perturbation and
      report it (handoff doc section 48).  Pinned by
      tests/test_closed_loop.py::test_anti_goal_equilibrium_is_unstable_and_amplifies_rounding
    separatrix_effect: >
      Near 180 deg the source's 1 deg heading quantisation can select a
      different attractor than our continuous loop: at 179 deg the source
      reaches the goal and ours reaches the limit cycle.  Trajectory-level
      agreement is therefore not expected at the separatrix; rho statistics
      agree throughout.

# =========================================================================
# STAGE 1 -- constrained body (2026-09-15)
# =========================================================================
stage1_body_parameter_scale:
  doc_section: 17
  doc_recipe: "R99 = 99th percentile of |r_brain| in the ideal baseline"
  status: REPLACED -- estimator changed, intent kept
  evidence:
    r99_converging_trials_by_duration_deg_per_s:
      2s: 1367.0
      5s: 898.4
      10s: 270.7
      30s: 5.1
      100s: 0.0
    r99_all_trials_by_duration_deg_per_s:
      2s: 1998.6
      100s: 2000.0
  why_it_fails: >
    The command time-series is not a distribution with a meaningful upper
    percentile.  It is a short transient plus a long tail of ~zero: the ideal
    loop reaches the goal in 3-4 cycles, so 71.5% of samples are below
    1 deg/s and the percentile measures recording length, not command size.
    Over all trials the statistic is instead dominated by the trials that fall
    into the period-2 limit cycle (finding F1) and saturates at the decoder
    peak.
  replacement:
    definition: "R_max = kappa * max|steering| = 2000 deg/s"
    why_well_defined: >
      The core's steering is normalised so that |steering| <= 1 on the
      calibration grid, so R_max is exact, duration-independent and
      trial-independent: the fastest turn the brain can ever request.
    numerical_agreement: "R99(all trials) = 1999.7 vs R_max = 2000.0 (0.02%)"
    consequence: "the sweep grid of section 17 is unchanged in practice"
  frozen_in: configs/neural_command_scale.json
  warning: >
    R_max is a simulation scale, never a vehicle specification.  Read
    "r_max = 0.5 R_max" as "the body can execute half of the fastest turn the
    brain ever requests".

stage1_components_added:
  files:
    - src/body/yaw_plant.py      # rate limit, acceleration cap, first-order lag
    - src/plugins/rate_clip.py   # plugin B, goal-blind
    - tests/test_body_limits.py  # doc section 44 items 7, 8, 9
  notes:
    tau_r_vs_alpha_max: >
      Kept as separate mechanisms and pinned by a test (doc section 11): a
      small command is shaped by the lag and never touches the cap, a large
      one saturates the cap.  They are not double counting.
    integration_guard: >
      Explicit Euler on the first-order lag is unstable unless
      dt_body << tau_r; the plant refuses to construct when
      tau_r < 2*dt_body rather than producing silent garbage.

# =========================================================================
# RETRACTION -- Stage 1 noise control (2026-09-15)
# experiments/stage1_noise_control.py, results/stage1_noise_control/
# =========================================================================
retracted_findings:

  rescued_by_body:
    claimed: >
      "Body limits rescue the core: 72.2% of the trials where the ideal body
      failed were completed successfully by the constrained body."
    status: RETRACTED -- artifact of the noise-free protocol
    evidence: >
      With the source's own command noise switched on, the ideal body succeeds
      at 100% of initial headings including +-90 deg, over 8 seeds.  Stage 0
      finding F1 (the period-2 limit cycle) exists only in the deterministic,
      noise-free condition; noise perturbs the trajectory out of the cycle and
      into the goal basin.  There is therefore nothing for the body to rescue,
      and the RESCUED_BY_BODY class only ever fires under a protocol that
      manufactures the failure it then rescues.
    what_remains_true: >
      F1 itself is real and still matters as a deterministic property of the
      core+decoder at k = 200 -- but it must be reported as "noise-free only",
      never as a failure mode of the circuit in general.
    lesson: >
      Section 24's "noise off, to isolate the body effect" is not free.  It
      removes a term the source model relies on.  Any Stage 1 result that
      depends on a baseline FAILURE has to be re-checked with noise on.

  r_max_main_effect:
    claimed: >
      "A faster body is worse: success falls from 0.979 to 0.646 as
      r_max goes from 0.01 to 1.0 R_max."
    status: RETRACTED as a main effect -- it is an interaction
    evidence: >
      At tau_r = T the success rate is 1.00 at every r_max tested (spread
      0.00).  The apparent main effect came from marginalising over tau_r,
      which mixes in the high-lag cells where the two interact.
    corrected_statement: >
      Rate capability alone does not hurt.  A fast body is harmful only in
      combination with response lag: at tau_r = 8T, success goes
      1.00 / 1.00 / 0.92 / 0.49 for r_max = 0.01 / 0.05 / 0.25 / 1.0 R_max.
      The boundary lives in the (r_max, tau_r) plane, not on either axis.
    lesson: >
      Same class of error as the selection effect caught in
      stage1_sweep_analysis.py: a marginal average over a grid with a strong
      interaction is not a main effect.

surviving_findings:
  tau_r_degradation:
    status: HOLDS with noise on
    statement: >
      Response lag degrades heading recovery monotonically, and does so
      without any feasibility limit being reached -- a genuine control
      failure rather than a physical one.
  three_axes_differ:
    status: HOLDS
    statement: >
      The rate limit only ever causes failure by making the task physically
      infeasible (success rate tracks feasibility exactly).  The acceleration
      cap and the response lag cause failures while the task remains feasible.
      That difference is the section 30 result.

# =========================================================================
# Conditions C and D (2026-09-16)
# =========================================================================
condition_C_state_aware_plugin:
  doc_section: 14.2
  status: NOT IMPLEMENTED -- measured to be a no-op where it matters
  proposed_law: "r_cmd = clip(r_brain, r - alpha_max*tau_r, r + alpha_max*tau_r) n [-r_max, r_max]"
  when_it_binds: "only when alpha_ratio * tau_ratio < r_max_ratio"
  measurement:
    failure_cells_alpha_4: "max trajectory deviation from B is exactly 0.00 deg"
    where_it_binds: "success 0.78 -> 0.67 at (r_max 1.0, alpha 0.005-0.01, tau 1)"
  conclusion: >
    In every cell where condition B actually fails, alpha_max*tau_r vastly
    exceeds r_max, so the clamp reduces to B's rate clip and the two are
    bit-identical.  Where it does bind it is neutral to harmful.  The document
    anticipated this in 14.2 and section 31 records that a null result for C
    is itself a result, so the plugin file was not written.
  if_revisited: >
    A plugin that could matter here would have to compensate the RESPONSE LAG,
    not the feasibility envelope -- and must stay goal-blind while doing it.

condition_D_p_controller:
  doc_section: 15
  implementation: src/core/p_controller.py
  law: "steering = clip(-K * wrap(heading - goal), -1, 1)"
  K: 0.35
  calibration: >
    Chosen on the 8 calibration initial headings with an ideal body, lowest
    IAE among K that succeed on all of them; frozen for the sweep exactly like
    kappa (sections 15, 47).  K >= 1.0 saturates and fails on all 8 -- the same
    over-gain failure the fly core shows at k = 200.
  paired_result:
    fly_core_success: 0.857
    p_controller_success: 0.793
    cells_where_both_fail: 59
    cells_where_only_fly_fails: 3
    cells_where_only_p_fails: 10
  reading: >
    The task-feasibility question section 15 exists to answer comes back clean:
    where the fly core fails, a generic controller under the same freeze
    almost always fails too (59 cells), so those failures are body-attributable
    rather than circuit-specific.  Only 3 cells are fly-specific, all at
    r_max = 1.0 R_max with tau_r = 8T -- the fast-body-plus-lag corner, which
    is the same interaction found in the sweep.
  caveat: >
    K is frozen, not re-tuned per body condition.  That is the protocol
    (section 3.3 applies to the baseline too), so the comparison is fair by
    construction, but "the fly core beats a P controller" means "beats a P
    controller under the same freeze", not "beats a tuned P controller".

# =========================================================================
# Condition C redesigned -- lag compensation (2026-09-16)
# =========================================================================
condition_C_lag_compensation:
  implementation: src/plugins/lag_comp.py
  motivation: >
    Section 14.2 said C would have to be redesigned, and the measurement
    agreed: the proposed feasibility clamp is bit-identical to B wherever B
    fails.  The surviving failures are caused by RESPONSE LAG, so this
    compensates that instead.
  law: "u = (r_brain - r*exp(-T/tau)) / (1 - exp(-T/tau)), clipped to r_max"
  why_no_tuning_knob: >
    Exact one-cycle inversion of the plant's first-order lag.  Nothing is
    fitted, so there is no parameter that could smuggle in task knowledge.
  goal_blind_verified:
    by_signature: "command(r_brain, r_actual); tau_r and r_max are body capability (section 3.5)"
    by_ablation: >
      With the core output forced to zero the heading moves by exactly
      0.000e+00 deg at tau = T and tau = 32T (section 44 item 12), pinned by
      tests/test_body_limits.py::test_lag_comp_is_goal_blind_and_cannot_navigate
  paired_result_vs_B:
    mean_success: "0.859 -> 0.942"
    cells: "42 better, 4 worse, 134 equal"
    effect_is_entirely_on_tau:
      tau_1_to_4: "+-0.008 (nothing)"
      tau_8: "+0.046"
      tau_16: "+0.154"
      tau_32: "+0.308"
    tau_axis_after_C: "0.942 -> 0.933 across tau = 1..32T, i.e. no effect"
  remaining_boundary:
    statement: >
      With C installed the lag axis is gone and the only failure mode left is
      the acceleration cap interacting with the rate limit.
    evidence: |
      alpha >= 0.02:  r_max 0.98 / 1.00 / 1.00 / 1.00 / 1.00   (flat)
      alpha <  0.02:  r_max 0.98 / 1.00 / 1.00 / 0.62 / 0.58
    caution: >
      Checked explicitly, because the same marginalisation error was made
      twice before: C's apparent r_max main effect is again an INTERACTION,
      this time with alpha_max.  Do not report it as a main effect.
  where_C_hurts:
    cells: "4, all at alpha_max = 0.01 R_max/T, delta -0.125"
    reason: >
      Same mechanism as its benefit: the inversion commands a large yaw rate,
      and a body whose acceleration cap cannot deliver it ends up worse off
      than under the plain rate clip.  C helps when lag is the binding
      constraint and hurts when acceleration is.
  it_does_not_repeal_physics: >
    Where the acceleration cap genuinely binds (alpha = 0.005, accel
    saturation fraction 0.77) C reaches only 0.44 against B's 0.22 -- a
    partial gain, not a fix.

section_29_phase_map:
  status: done
  figure: "results/stage1_sweep/<tag>/fig6_outcome_phase_map.png"
  content: >
    Dominant OUTCOME per (r_max, tau_r) cell rather than a success rate, which
    is what section 29 actually asks for: the map says what happened, not just
    how often it worked.  Generated for every sweep tag.

noise_on_sweep:
  status: DONE -- full grid re-run with the source noise, both plugins
  motivation: >
    Every Stage 1 number before this ran noise-free (doc section 24).  The
    noise control had already shown that the ideal body's +-90 deg limit
    cycle (finding F1) does not survive noise, and F1 is what every
    BASELINE_FAILURE / RESCUED_BY_BODY trial is built on.  Only 12 cells had
    been checked, and the sweep script had no noise path at all: "noise" was
    a hardcoded provenance string, not a switch.
  implementation:
    - "src/sim/noise.py: command_noise_rad_per_s(n_steps, T, seed) -- seeded
       by an int alone, so the same draw is reused in every cell and the
       sweep is PAIRED across cells."
    - "experiments/stage1_body_sweep.py: --noise-seeds N."
    - "Condition A baseline re-run per (e0, seed).  Judging a noisy
       constrained trial against a noise-free baseline verdict would make
       RESCUED_BY_BODY a comparison of two different draws."
    - "is_task_feasible hoisted out of the seed loop: it is a property of the
       plant, not of the draw."
  regression_check: >
    --quick with noise off reproduces the previous run bit-identically
    (pandas DataFrame.equals -> True, 216 trials).
  runs:
    - "tag 'noise'          : plugin rate_clip, 36288 trials, 2460 s"
    - "tag 'noise_lagcomp'  : plugin lag_comp,  36288 trials, 2514 s"
    - "8 seeds x 18 headings x 252 cells"

  R1_rescue_result_is_a_noise_free_artifact:
    status: CONFIRMED at full scale -- the retraction stands
    measured: "condition A succeeds 144/144 baseline trials with noise on"
    consequence: >
      n_baseline_failures = 0 and n_rescued_by_body = 0 in both noise runs,
      against 504 and 364 noise-free.  Every trial in those two categories
      was an e0 = +-90 deg trial, i.e. F1.  The "body limits rescue the core"
      claim exists ONLY in the deterministic protocol and must never be
      reported without that qualifier.
    side_effect: "attributable fraction rises 0.725 -> 0.817"

  R2_body_attributable_failure_survives_noise:
    status: CONFIRMED
    measured: >
      Genuine failure modes persist with noise on: saturation_dominated 4.1%,
      slow_but_stable 4.0%, overshoot_dominant 2.5%, persistent_oscillation
      1.7%.  Paired axis directions are unchanged in sign from the noise-free
      sweep (r_max hurts, alpha helps, tau hurts).
    note: >
      This is the half of the Stage 1 result that is real.  Noise makes the
      constrained-body failures modestly WORSE, not better.

  R3_body_lag_low_passes_neural_noise:
    status: NEW FINDING -- visible only with noise on
    observation: >
      At r_max = 0.05 R_max, alpha = 0.005, success is NON-MONOTONIC in tau:
      0.66 (tau=T), 0.65, 0.75, 0.94, 1.00 (tau=16T), 0.75 (tau=32T).
      Noise-free the same cells are all 1.000 except tau=32 (0.875), so the
      effect is invisible without noise.
    consistency: "all 8 seeds show it independently (tau=16 -> 1.000 in every seed)"
    mechanism_measured: >
      std(r_commanded) is flat at ~1.5 rad/s across tau (same injected
      noise), while std(r_actual)/std(r_commanded) falls monotonically
      0.510 -> 0.276 as tau goes T -> 32T.  The plant is low-passing the
      command noise; success tracks that attenuation until the lag's own
      phase cost takes over, giving an optimum near tau = 16 T.
    interpretation: >
      A body constraint can IMPROVE navigation by filtering neural noise.
      This is an embodiment result in the opposite direction from the
      retracted rescue claim, and unlike that one it requires noise rather
      than being destroyed by it.
    related: "the rate clip does the same job at the other end of the grid --
      plugin_intervention_fraction 0.996 at r_max=0.002 falling to 0.022 at
      r_max=1.0, while accel_saturation_fraction rises 0.000 -> 0.336.  The
      constraint does not disappear as r_max grows, it moves from the rate
      limit to the acceleration limit."

  R4_prediction_that_failed:
    status: PREDICTION MADE BEFORE THE RUN, THEN FALSIFIED -- recorded as such
    prediction: >
      If body lag helps by low-passing noise (R3), then plugin C, which
      inverts one cycle of that lag, should REMOVE the filter and lose
      performance in exactly those cells.
    measured: >
      It does not.  At r_max=0.05, alpha=0.005 the deltas C-B are
      +0.01 +0.07 +0.00 +0.06 +0.00 +0.22 across tau = 1..32; C is equal or
      better everywhere in that slice and +0.22 at tau=32.
    why_the_prediction_was_wrong: >
      C amplifies the command by 1/(1-a) and the plant attenuates it by the
      same factor, so the noise reaches the body at roughly its unfiltered
      level while the intended signal is restored in phase.  C trades the
      filter for the removal of the phase lag, and under these conditions
      that trade is favourable.
    kept_because: >
      Section 31: a falsified prediction that was stated in advance is worth
      more than one quietly dropped.

  R5_condition_C_under_noise:
    paired_B_vs_C: "0.825 -> 0.912 (55 cells better, 20 worse, 105 equal)"
    tau_axis_after_C: "0.907 0.910 0.912 0.920 0.923 0.898 -- flat, as noise-free"
    by_tau_delta: "tau=1 -0.006, tau=8 +0.059, tau=16 +0.164, tau=32 +0.303"
    the_20_worse_cells: >
      All at alpha <= 0.05 and mostly tau <= 8, max harm -0.062.  Same
      mechanism as noise-free: the inversion commands more acceleration than
      the cap can deliver.  Not a new failure mode.
    conclusion: >
      Condition C's result is unchanged by noise in both direction and shape.

  caveats:
    feasibility_is_still_noise_free: >
      is_task_feasible uses noiseless max-effort reachability, so a trial that
      is only marginally feasible may be counted as a genuine failure when
      noise pushed it over.  The check is deliberately generous to the body,
      so this inflates apparent body-attributable failure rather than hiding
      it.  Not corrected; recorded.
    marginal_axis_numbers: >
      provenance.json's axis_effect_range_MARGINAL / largest_marginal_effect_axis
      are unpaired marginals and are NOT main effects.  Renamed from
      axis_effect_range / largest_effect_axis for exactly that reason; the two
      noise runs' files were relabelled in place after the fact (same numbers).
    runtime: >
      ~41 min per full noise sweep, 1.54x the estimate extrapolated from a
      1728-trial run.  Per-trial cost is uniform across the grid (40.9-42.8 ms
      measured at three corners), so the overshoot is most likely GC pressure
      from the 36288-row results list, which a 21x smaller benchmark does not
      show.  Progress prints now flush; a redirected run was block-buffered
      and therefore indistinguishable from a hung one for 40 minutes.
