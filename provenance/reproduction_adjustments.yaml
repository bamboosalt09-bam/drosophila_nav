# Every place where this implementation does something the handoff document
# / source paper does not fully specify.  Nothing here may be silently
# promoted to "exact reproduction of Westeinde et al. 2024".
#
# status: open   -> must be resolved against the official code/notebook
#         closed -> resolved, with the resolution recorded

assumptions:

  A1_goal_input_form:
    status: CLOSED -- confirmed correct against the official code
    doc_text: "I_goal = A cos(theta_g - theta0 - h)"
    problem: >
      As written the goal input contains no neural phase theta, so it is a
      constant across the whole population.  A constant cannot create any
      left/right asymmetry, and the core would output exactly zero steering
      at every heading error.
    implemented_instead: "I_goal(theta) = A * cos(theta - theta0 - theta_g)"
    justification: >
      Standard goal-bump form: a goal representation sitting at neural phase
      theta_g, summed with the phase-shifted heading input.  Reproduces the
      expected qualitative behaviour (PFL3R/PFL3L tuned to +-67.5 deg,
      PFL2 anti-goal, odd-symmetric restoring steering).
    action_required: "verify against the official Westeinde notebook"

  A2_activation_and_normalisation:
    status: CLOSED -- replaced by the source's rescale+ELU1 (see source_code_findings)
    implemented: "activity = ELU(gain_S * drive), alpha = 1, normalize = none"
    alternatives_available: [global_peak, global_rms]
    note: >
      Normalisation must be COMMON to all populations.  Per-population
      normalisation would erase the R/L amplitude difference and force the
      steering output to zero (pinned by
      tests/test_core_symmetry.py::test_per_population_normalisation_would_break_the_model).
    action_required: "confirm the source normalisation and the placement of gain S"

  A3_population_readout:
    status: WITHDRAWN -- source sums over cells; this assumption no longer applies
    implemented: "population output = MEAN over the phase grid (not SUM)"
    justification: >
      Makes results independent of n_units, which is a discretisation knob of
      the reduced model rather than a biological cell count.  Verified by
      tests/test_core_symmetry.py::test_result_is_independent_of_discretisation
      (n_units 200..2000 agree to 2e-3 relative).

  A4_dn_stage_nonlinearity:
    status: CLOSED -- source applies ELU1 at every stage; that is what makes PFL2 matter
    implemented: "ELU applied again at DNa03 and DNa02 (dn_activation = True)"
    see_also: O1

  A5_sign_convention:
    status: closed
    implemented: >
      The core returns the RAW value DNa02R - DNa02L, positive for
      e = wrap(heading - goal) > 0.  Converting it into a physical yaw rate,
      including the sign needed for negative feedback under the project's
      CCW-positive convention, is the decoder's job (kappa), not the core's.

open_issues:

  O1_pfl2_has_no_effect_on_steering:
    status: CLOSED -- cause found and fixed (missing rescale); PFL2 now dominates
    found: "Stage 0 part 1, open-loop characterisation"
    observation: >
      PFL2 has the expected anti-goal tuning (minimum at the goal, maximum at
      180 deg) but changes the steering command by exactly zero.  Lesioning it
      (w_pfl2_dna03 = 0) leaves the output bit-identical.
    mechanism: >
      Population activities are non-negative, so every DNa03/DNa02 input is
      positive and the ELU never leaves its identity regime.  The whole DN
      cascade therefore collapses to a constant gain
      (w_pfl3_dna02 + w_dna03_dna02 * w_pfl3_dna03) = 1 + 12 = 13, and PFL2,
      being bilateral common drive, cancels exactly in DNa02R - DNa02L.
    pinned_by:
      - tests/test_core_symmetry.py::test_dn_cascade_is_currently_a_constant_gain_of_13
      - tests/test_core_symmetry.py::test_pfl2_currently_cancels_in_the_steering_readout
    consequences_if_left_unresolved: >
      Stage 0 still validates the PFL3-driven steering pathway, but any claim
      about PFL2 (e.g. that it modulates turn magnitude when facing away from
      the goal) would be unsupported by this implementation.  The weights
      PFL2 -> DNa03 = 4 and DNa03 -> DNa02 = 12 would carry no functional
      content beyond an overall scale absorbed by the decoder gain kappa.
    candidate_resolutions_NOT_yet_chosen:
      - "source DN stage may be saturating / supralinear rather than ELU"
      - "PFL2 may act on forward speed or on an overall gain term, not on the
         left-right difference"
      - "PFL2 -> DNa03 may be asymmetric or inhibitory in the source model"
    action_required: >
      Read the official Westeinde et al. 2024 code/notebook before choosing.
      Do NOT invent a mechanism to make PFL2 matter.

# =========================================================================
# 2026-09-15: OFFICIAL SOURCE CODE OBTAINED
# github.com/wilson-lab/WesteindeWilson_AnalysisCode
#   Westeinde_et_al_model/Westeinde et al Model.ipynb
#   "Coded by Lydia Hamburg, joint work between the Druckmann and Wilson labs"
# Local copy: reference/westeinde_official/  (reference only, not our code)
# Author Correction (Nature 2025, s41586-024-08245-8) corrects PFL2
# split-GAL4 genotype strings only; the model is unaffected.
# =========================================================================

source_code_findings:

  A1_goal_input_form:
    resolution: CONFIRMED -- our correction was right
    official: "goal_cells = A * cos(deg2rad(-hd_prefs + P - offset_deg))"
    meaning: "A * cos(theta - theta_g), a goal bump at neural phase theta_g"
    verdict: >
      The handoff document's "I_goal = A cos(theta_g - theta0 - h)" was a
      transcription error.  Our implemented form matches the source.

  A2_normalisation:
    resolution: OUR IMPLEMENTATION IS WRONG -- must be replaced
    official_ELU1: |
      scaled    = linear_rescale(activity, -1, 1)   # min-max over the array
      nonlinear = scaled          if scaled >= 0
                  exp(scaled) - 1 if scaled <  0
      output    = linear_rescale(nonlinear, 0, 1)   # min-max again
    applied_at: "EVERY stage -- PFL2/PFL3R/PFL3L, DNa03R/L, and DNa02R/L"
    our_error: "plain ELU with no rescaling, at the PFL stage only in effect"
    other_options_in_source: [ELU2, Sigmoid, ReLU, LeakyReLU, None]
    source_default: ELU1

  O1_pfl2_has_no_effect_on_steering:
    resolution: SOLVED -- caused by the missing rescale
    explanation: >
      linear_rescale(-1, 1) re-centres the DN drive so that low-drive
      conditions land on the NEGATIVE branch of the ELU.  The DN stage is then
      genuinely nonlinear, and PFL2's bilateral common drive no longer cancels
      in DNa02R - DNa02L.  Without the rescale every DN input stays positive,
      the ELU is the identity, and PFL2 cancels exactly -- which is what we
      observed.

  population_readout:
    resolution: OUR IMPLEMENTATION IS WRONG
    official: "np.sum over cells (axis=3)"
    ours: "mean over cells"
    note: >
      With the min-max rescale in place the sum does not blow up with
      n_units, so assumption A3 is no longer needed and must be dropped.

  left_right_phase_convention:
    resolution: OURS IS MIRRORED
    official: "pfl3r_HD_input = cos(HD - hd_prefs + 67.5)"
    ours: "cos(theta - heading + 67.5)"
    consequence: >
      With theta playing the role of hd_prefs, the official PFL3R equals our
      PFL3L.  Our steering therefore has the OPPOSITE sign to the source, and
      the source's own closed loop (hd += k*steering) would diverge with our
      sign.  Fix by mirroring the phase shifts, not by hiding the sign in kappa.

  decoder_gain_kappa:
    resolution: SOURCE VALUE FOUND
    official: "k = 200  # factor relating PFL activity to steering"
    applied_to: >
      the steering signal AFTER it is divided by its maximum over the whole
      (goal_phase x S x HD) sweep, so k multiplies a quantity whose peak is 1.
    units: "degrees per timestep, with fs = 10 Hz, i.e. 0.1 s per step"
    closed_loop: "hd[t] = wrap_to_180(hd[t-1] + k*steering_norm + noise[t])"
    note: >
      That closed loop adds the COMMAND directly to the heading -- it is an
      ideal body with no dynamics.  It is exactly our condition A, and exactly
      the structure our study replaces from condition B onward (doc 3.4).

  noise_specification:
    resolution: SOURCE VALUES FOUND
    recipe: "gaussian -> butterworth low-pass (order 5, fpass 2 Hz, fs 10 Hz) -> zscore -> * noise_level"
    noise_level: 10
    num_runs: 50
    num_timepoints: 1000     # 100 s at 10 Hz
    initial_hd_deg: 180      # starts at the unstable equilibrium on purpose

  hemibrain_data_variant:
    resolution: NEW -- not mentioned in the handoff document
    option: "connectivity_option = 'data'"
    contents: >
      12 cells per type with per-cell hemibrain synapse counts and per-cell
      PB-glomerulus HD preferences, instead of the abstract 1:4:12 weights.
      DNa03 -> DNa02 is 271 in the data variant.
    relevance: >
      Gives a real-connectome version of the SAME core, at 12 cells per type.
      Relevant to the long-term Q2 (whole-brain FlyWire) direction.
    caution: >
      The notebook hardcodes np.tile(..., (1000,1,1,1)) in the DNa02 step,
      which assumes num_cells = 1000.  Verify before trusting 'data' mode.

open_problems_created_by_the_source_implementation:

  batch_dependence_of_the_normalisation:
    severity: high
    problem: >
      linear_rescale takes min/max over the ENTIRE array, which spans all goal
      phases, all S values and all head directions.  The model output for one
      (heading, goal) therefore depends on which other conditions were in the
      sweep.  The source model is not a pure function of (heading, goal).
    why_it_matters_here: >
      Our core must be a frozen, pure function, or "the core is identical
      across body conditions" becomes false.
    planned_resolution: >
      Compute the rescale constants ONCE from a reference sweep that matches
      the official grid (goal_phase -180:10:180, S in linspace(0,1,6),
      HD -180:1:180), freeze them as core parameters, and record them in
      provenance.  Document as a deliberate deviation required for closed-loop
      use.

  docstring_contradicts_code:
    severity: low
    detail: >
      The notebook docstring says pfl3_inhibitory_option true = excitatory,
      false = inhibitory, but the code negates PFL3 when the flag is TRUE.
      Default False therefore means EXCITATORY, which is what the handoff
      document assumed (S4).  No change needed, but do not trust the docstring.

